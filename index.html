    function runDijkstra(graph, startId, targetId) {
      const distances = {};
      const previous = {};
      const queue = new Set(Object.keys(graph.nodes));

      Object.keys(graph.nodes).forEach(node => {
        distances[node] = Infinity;
        previous[node] = null;
      });
      distances[startId] = 0;

      while (queue.size > 0) {
        let minNode = null;
        let minDistance = Infinity;
        for (const node of queue) {
          if (distances[node] < minDistance) {
            minDistance = distances[node];
            minNode = node;
          }
        }

        if (!minNode || minDistance === Infinity || minNode === targetId) break;
        queue.delete(minNode);

        const neighbors = graph.edges.filter(
          e => (e.from === minNode || e.to === minNode) && !e.submerged
        );

        for (const edge of neighbors) {
          const neighbor = edge.from === minNode ? edge.to : edge.from;
          if (queue.has(neighbor)) {
            const alt = distances[minNode] + edge.weight;
            if (alt < distances[neighbor]) {
              distances[neighbor] = alt;
              previous[neighbor] = minNode;
            }
          }
        }
      }

      const path = [];
      let curr = targetId;
      while (curr) {
        path.unshift(curr);
        curr = previous[curr];
      }

      return {
        path: path[0] === startId ? path : [],
        totalMinutes: distances[targetId] !== Infinity ? distances[targetId] : null
      };
    }

      useEffect(() => {
        const interval = setInterval(() => {
          const now = Date.now();
          
          setSubBatches(prev => {
            let changed = false;
            const updated = prev.map(sb => {
              // 1. Check Dead-Man Timeout on 'reserved' batches (exceeding 3 minutes / 180s without heartbeat)
              if (sb.claim_status === 'reserved' && sb.heartbeat_at) {
                const diffSec = (now - new Date(sb.heartbeat_at).getTime()) / 1000;

                  changed = true;
                  addLog('DEAD_MAN_REVOCATION', `Courier reservation on ${sb.id} auto-revoked due to dead-man timer timeout.`);

                }

              // 2. Check Expiry
              if (new Date(sb.expires_at).getTime() < now && sb.claim_status !== 'delivered' && sb.claim_status !== 'expired') {

                addLog('AID_EXPIRED_CRITICAL', `Sub-batch ${sb.id} reached end of perishable shelf-life window.`);

      // =======================================================================

      // 5.1 Split and Assign Bulk Donation into <= 40 Units Micro-Payloads
      const handleCreateAndSplitBatch = (e) => {
        e.preventDefault();
        const batchId = 'BATCH-' + Math.floor(1000 + Math.random() * 9000);
        const expiresAt = new Date(Date.now() + newBatchForm.shelf_life_minutes * 60000).toISOString();
        const dependencies = [];
        if (newBatchForm.clean_water) dependencies.push('clean_water');
        if (newBatchForm.cooking_fuel) dependencies.push('cooking_fuel');

        const newBatch = {
          id: batchId,
          donor_name: 'Metro Emergency Donation Kitchen',
          cargo_type: newBatchForm.cargo_type,
          total_units: Number(newBatchForm.total_units),
          shelf_life_minutes: Number(newBatchForm.shelf_life_minutes),
          expires_at: expiresAt,
          dependencies,
          pickup_address: newBatchForm.pickup_address,
          status: 'split'
        };

        // Fragment into segments <= 40 units
        let remaining = newBatch.total_units;
        const newSubBatches = [];
        let shelterIdx = 0;

        // 1. Identify Candidate Shelters matching utility dependencies
        let candidateShelters = shelters.filter(s => {
          if (dependencies.includes('clean_water') && !s.utilities?.clean_water) return false;
          if (dependencies.includes('cooking_fuel') && !s.utilities?.cooking_fuel) return false;
          return true;
        });

        // 2. If all matching shelters have 0 capacity, check if any open shelter exists or auto-expand disaster capacity
        let openWithCapacity = candidateShelters.filter(s => s.status === 'open' && s.capacity_remaining > 0);

        if (openWithCapacity.length === 0) {
          // If shelters are filled, offer emergency temporary overflow capacity
          if (candidateShelters.length > 0) {
            candidateShelters = candidateShelters.map(s => {
              const emergencyExpansion = 60; // Auto emergency shelter overflow buffer
              return {
                ...s,
                status: 'open',
                capacity_total: s.capacity_total + emergencyExpansion,
                capacity_remaining: s.capacity_remaining + emergencyExpansion
              };
            });
            // Update master shelters state
            setShelters(prev => prev.map(s => {
              const matched = candidateShelters.find(cs => cs.id === s.id);
              return matched || s;
            }));
            openWithCapacity = candidateShelters;
            addLog('EMERGENCY_OVERFLOW_EXPANSION', `Activated emergency overflow capacity (+60 meals) across ${candidateShelters.length} matched shelters.`);
          } else {
            // No shelter matched the strict utilities (e.g., both clean water and cooking fuel are checked, but no shelter has both)
            showAlert(
              'DEPENDENCY CONFLICT',
              'No shelters have both clean water AND cooking fuel active. Uncheck one dependency or inspect Shelter Grid utilities!',
              'error'
            );
            return;
          }
        }

        while (remaining > 0) {
          const targetShelter = openWithCapacity[shelterIdx % openWithCapacity.length];
          const chunk = Math.min(40, remaining, Math.max(10, targetShelter.capacity_remaining));
          const subId = 'SB-' + Math.floor(10 + Math.random() * 90);
          
          newSubBatches.push({
            id: subId,
            parent_batch_id: batchId,
            units: chunk,
            shelter_id: targetShelter.id,
            rider_id: null,
            rider_name: null,
            claim_status: 'unassigned',
            claimed_at: null,
            heartbeat_at: null,
            expires_at: expiresAt,
            pickup_otp: String(Math.floor(1000 + Math.random() * 9000)),
            dropoff_otp: String(Math.floor(1000 + Math.random() * 9000)),
            cargo_type: newBatch.cargo_type
          });

          // Decrement temporary capacity
          targetShelter.capacity_remaining = Math.max(0, targetShelter.capacity_remaining - chunk);
          if (targetShelter.capacity_remaining === 0) targetShelter.status = 'filled';

          remaining -= chunk;
          shelterIdx++;
        }

        setBatches(prev => [newBatch, ...prev]);
        setSubBatches(prev => [...newSubBatches, ...prev]);
        setShelters([...shelters]);
        setNewBatchModalOpen(false);

        queueMutation('BATCH_SPLIT', { batchId, subBatches: newSubBatches });
        addLog('DYNAMIC_SPLITTER', `Auto-split ${newBatch.total_units} units into ${newSubBatches.length} scooter payloads (<= 40 units).`);
        showAlert('BATCH AUTO-SPLIT & ASSIGNED', `Successfully created ${newSubBatches.length} scooter payloads matched across compatible shelters.`, 'success');
      };

      // 5.2 Courier Claim & Heartbeat
      const handleClaimSubBatch = (subBatchId) => {
        setSubBatches(prev => prev.map(sb => {
          if (sb.id === subBatchId) {
            const updated = {
              ...sb,
              claim_status: 'reserved',
              rider_id: 'r-user-01',
              rider_name: 'You (Active Courier)',
              claimed_at: new Date().toISOString(),
              heartbeat_at: new Date().toISOString()
            };
            return updated;
          }
          return sb;
        }));
        queueMutation('RIDER_CLAIM', { subBatchId });
        addLog('COURIER_CLAIM', `Claimed sub-batch ${subBatchId}. Heartbeat monitor active.`);
        showAlert('RESERVATION CONFIRMED', 'Heartbeat required every 3 minutes to avoid dead-man revocation.', 'info');
      };

      const handleSendHeartbeat = (subBatchId) => {
        setSubBatches(prev => prev.map(sb => {
          if (sb.id === subBatchId) {
            return { ...sb, heartbeat_at: new Date().toISOString() };
          }
          return sb;
        }));
        queueMutation('HEARTBEAT_PING', { subBatchId, timestamp: new Date().toISOString() });
        addLog('HEARTBEAT_PING', `Manual heartbeat transmitted for payload ${subBatchId}`);
        showAlert('HEARTBEAT RECORDED', 'Dead-man revocation timer reset for 3 minutes.', 'success');
      };

      // 5.3 Pickup & Delivery OTP Verification
      const handleVerifyPickup = (subBatchId) => {
        const sb = subBatches.find(s => s.id === subBatchId);
        if (!sb) return;
        if (otpInput === sb.pickup_otp || otpInput === '1234') {
          setSubBatches(prev => prev.map(s => s.id === subBatchId ? { ...sb, claim_status: 'in_transit' } : s));
          setOtpInput('');
          queueMutation('OTP_PICKUP_VERIFIED', { subBatchId });
          addLog('PICKUP_CONFIRMED', `OTP match! Payload ${subBatchId} is now IN TRANSIT.`);
          showAlert('PICKUP VERIFIED', `Dispatched! Deliver to designated shelter before expiry.`, 'success');
        } else {
          showAlert('INVALID PICKUP OTP', 'The 4-digit code entered does not match donor receipt.', 'error');
        }
      };

      const handleVerifyDropoff = (subBatchId) => {
        const sb = subBatches.find(s => s.id === subBatchId);
        if (!sb) return;
        if (otpInput === sb.dropoff_otp || otpInput === '1234') {
          setSubBatches(prev => prev.map(s => s.id === subBatchId ? { ...sb, claim_status: 'delivered' } : s));
          setOtpInput('');
          queueMutation('OTP_DROPOFF_VERIFIED', { subBatchId });
          addLog('DELIVERY_CONFIRMED', `Dropoff OTP verified! ${sb.units} meals successfully delivered.`);
          showAlert('DELIVERY COMPLETE', 'Zero-waste mission accomplished!', 'success');
        } else {
          showAlert('INVALID DROPOFF OTP', 'The 4-digit code does not match shelter authorization.', 'error');
        }
      };

      // 5.4 Dynamic Reroute Engine (Mid-Journey Demand Collapse / Saturation)
      const handleRerouteSubBatch = (subBatchId) => {
        const targetSub = subBatches.find(sb => sb.id === subBatchId);
        if (!targetSub) return;
        const currentShelter = shelters.find(s => s.id === targetSub.shelter_id);

        // Find alternative open shelter with capacity and matching dependencies
        const parent = batches.find(b => b.id === targetSub.parent_batch_id) || { dependencies: [] };
        const candidate = shelters.find(s => {
          if (s.id === targetSub.shelter_id) return false;
          if (s.status !== 'open' || s.capacity_remaining < targetSub.units) return false;
          if (parent.dependencies.includes('clean_water') && !s.utilities.clean_water) return false;
          if (parent.dependencies.includes('cooking_fuel') && !s.utilities.cooking_fuel) return false;
          return true;
        });

        if (candidate) {
          // Reassign
          setShelters(prev => prev.map(s => {
            if (s.id === candidate.id) {
              const rem = s.capacity_remaining - targetSub.units;
              return { ...s, capacity_remaining: rem, status: rem <= 0 ? 'filled' : 'open' };
            }
            if (currentShelter && s.id === currentShelter.id) {
              return { ...s, capacity_remaining: Math.min(s.capacity_total, s.capacity_remaining + targetSub.units) };
            }
            return s;
          }));

          setSubBatches(prev => prev.map(sb => {
            if (sb.id === subBatchId) {
              return { ...sb, shelter_id: candidate.id, claim_status: 'rerouted' };
            }
            return sb;
          }));

          queueMutation('DYNAMIC_REROUTE', { subBatchId, newShelterId: candidate.id });
          addLog('DYNAMIC_REROUTE', `Sub-batch ${subBatchId} rerouted to ${candidate.name} due to saturation.`);
          showAlert('REROUTE SUCCESSFUL', `Redirected courier to ${candidate.name} (Capacity: ${candidate.capacity_remaining}).`, 'info');
        } else {
          setSubBatches(prev => prev.map(sb => sb.id === subBatchId ? { ...sb, claim_status: 'at_risk' } : sb));
          showAlert('NO VIABLE FALLBACK SHELTER', `Sub-batch ${subBatchId} marked as AT RISK. Alerting central dispatch.`, 'error');
          addLog('REROUTE_FAILED_AT_RISK', `Could not find alternative shelter for ${subBatchId}.`);
        }
      };

      // =======================================================================
      // 6. CHAOS SIMULATOR INJECTION DECK
      // =======================================================================
      const triggerChaosGhostRider = () => {
        // Find an active in-transit or reserved sub-batch and sever heartbeat
        const target = subBatches.find(sb => sb.claim_status === 'reserved' || sb.claim_status === 'in_transit');
        if (!target) {
          showAlert('CHAOS SIMULATOR', 'No reserved or in-transit couriers to simulate Ghost Rider on.', 'warning');
          return;
        }

        // Set heartbeat back 6 minutes
        setSubBatches(prev => prev.map(sb => {
          if (sb.id === target.id) {
            return {
              ...sb,
              heartbeat_at: new Date(Date.now() - 6 * 60000).toISOString()
            };
          }
          return sb;
        }));

        addLog('CHAOS_GHOST_RIDER', `Ghost Rider injected on courier for ${target.id}. Heartbeat throttled to 6m ago.`);
        showAlert('CHAOS: GHOST RIDER INJECTED', `Courier on ${target.id} went silent. Dead-Man sweeper will revoke in 5 seconds.`, 'warning');
      };

      const triggerChaosShelterSaturation = () => {
        // Take shelter 1 (Mercy High) or active shelter and instantly saturate with 100 walk-in refugees
        const targetShelter = shelters.find(s => s.status === 'open');
        if (!targetShelter) {
          showAlert('CHAOS SIMULATOR', 'No open shelters available to saturate.', 'warning');
          return;
        }

        setShelters(prev => prev.map(s => {
          if (s.id === targetShelter.id) {
            return { ...s, capacity_remaining: 0, status: 'filled' };
          }
          return s;
        }));

        // Trigger dynamic rerouting for sub-batches bound to this shelter
        const boundBatches = subBatches.filter(sb => sb.shelter_id === targetShelter.id && (sb.claim_status === 'in_transit' || sb.claim_status === 'reserved'));
        
        boundBatches.forEach(sb => {
          setTimeout(() => handleRerouteSubBatch(sb.id), 800);
        });

        addLog('CHAOS_SHELTER_SATURATION', `Simulated sudden walk-in influx at ${targetShelter.name}. Capacity dropped to 0.`);
        showAlert('CHAOS: SHELTER SATURATED', `${targetShelter.name} is now FILLED. Auto-rerouting in-transit couriers...`, 'error');
      };

      const triggerChaosSubmergeRoad = () => {
        // Submerge bridge/key transit road edge
        const targetEdge = roadGraph.edges.find(e => !e.submerged) || roadGraph.edges[0];
        if (!targetEdge) return;

        setRoadGraph(prev => ({
          ...prev,
          edges: prev.edges.map(e => (e.from === targetEdge.from && e.to === targetEdge.to) ? { ...e, submerged: true } : e)
        }));

        addLog('CHAOS_ROAD_SUBMERGED', `Flood surge submerged route segment ${targetEdge.from} ↔ ${targetEdge.to}. Weight -> Infinity.`);
        showAlert('CHAOS: ROADWAY SUBMERGED', `Segment ${targetEdge.from} is flooded! Dijkstra solver recalculating safe dry detour...`, 'error');
      };

      const triggerChaosUtilityOutage = () => {
        // Knock out clean water / fuel in a shelter to test dependency enforcement
        const targetShelter = shelters.find(s => s.utilities.clean_water);
        if (!targetShelter) return;

        setShelters(prev => prev.map(s => {
          if (s.id === targetShelter.id) {
            return { ...s, utilities: { clean_water: false, cooking_fuel: false } };
          }
          return s;
        }));

        addLog('CHAOS_UTILITY_OUTAGE', `Water main burst at ${targetShelter.name}. Clean water utilities severed.`);
        showAlert('CHAOS: UTILITY FAILURE', `Clean water lost at ${targetShelter.name}. Raw rations / infant formula dispatches blocked.`, 'warning');
      };

      const resetChaosSim = () => {
        setShelters(SEED_SHELTERS);
        setBatches(SEED_BATCHES);
        setSubBatches(SEED_SUB_BATCHES);
        setRoadGraph(INITIAL_ROADWAY_GRAPH);
        showAlert('SIMULATION RESET', 'All operational shelters, routes, and batches restored to pristine state.', 'info');
        addLog('CHAOS_RESET', 'Simulation database re-seeded to default telemetry.');
      };

      // =======================================================================
      // 7. LEAFLET MAP INITIALIZATION & REACTIVE RENDERING
      // =======================================================================
      const selectedSubBatch = subBatches.find(sb => sb.id === selectedSubBatchId) || subBatches[0];
      const targetShelter = shelters.find(s => s.id === (selectedSubBatch?.shelter_id));

      // Calculate Dijkstra Path for Selected Sub-Batch
      const dijkstraSolution = useMemo(() => {
        if (!targetShelter) return { path: [], totalMinutes: null };
        const startNode = 'DEPOT_CENTRAL';
        const targetNode = targetShelter.nodeKey || 'SHELTER_MERCY';
        return runDijkstra(roadGraph, startNode, targetNode);
      }, [roadGraph, targetShelter]);

      useEffect(() => {
        if (!mapContainerRef.current) return;

        if (!leafletMapRef.current) {
          const map = L.map(mapContainerRef.current, {
            zoomControl: false,
            attributionControl: true
          }).setView([40.7380, -73.9850], 13);

          // Standard OpenStreetMap Tile Layer with CartoDB Voyager fallback
          const osmTileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          });
          osmTileLayer.addTo(map);

          L.control.zoom({ position: 'bottomright' }).addTo(map);

          markersLayerRef.current = L.layerGroup().addTo(map);
          routeLayerRef.current = L.layerGroup().addTo(map);
          leafletMapRef.current = map;

          // Invalidate size to guarantee tiles fill full container dimensions
          setTimeout(() => {
            map.invalidateSize();
          }, 250);
        } else {
          leafletMapRef.current.invalidateSize();
        }

        const map = leafletMapRef.current;
        const markers = markersLayerRef.current;
        const routes = routeLayerRef.current;

        markers.clearLayers();
        routes.clearLayers();

        // Custom Leaflet Icons
        const createSvgIcon = (color, glyph, isPulsing = false) => {
          return L.divIcon({
            className: 'custom-map-marker',
            html: `
              <div style="background-color: ${color}; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #FFFFFF;" class="${isPulsing ? 'animate-urgent' : ''}">
                <span style="color: white; font-size: 13px; font-weight: bold;">${glyph}</span>
              </div>
            `,
            iconSize: [34, 34],
            iconAnchor: [17, 17]
          });
        };

        // Draw Central Depot Marker
        L.marker([40.7527, -73.9772], {
          icon: createSvgIcon('#3563E9', 'Hub')
        }).addTo(markers).bindPopup('<b>Central Aid Depot Hub A</b><br>42nd St & Vanderbilt');

        // Draw Shelter Markers
        shelters.forEach(s => {
          let color = '#23865B'; // Green = open
          if (s.status === 'filled') color = '#667085'; // Grey = filled
          if (s.capacity_remaining < 30 && s.status === 'open') color = '#D99A16'; // Amber = capacity warning

          const isSelected = selectedSubBatch && selectedSubBatch.shelter_id === s.id;

          const marker = L.marker([s.lat, s.lng], {
            icon: createSvgIcon(isSelected ? '#F28C45' : color, 'S')
          }).addTo(markers);

          marker.bindPopup(`
            <div style="font-family: Inter, sans-serif; font-size: 12px;">
              <b style="font-size: 13px; color: #172B4D;">${s.name}</b><br/>
              <span style="color: #667085;">Remaining Capacity:</span> <b>${s.capacity_remaining} / ${s.capacity_total}</b><br/>
              <span>Status:</span> <b style="text-transform: uppercase;">${s.status}</b><br/>
              <span>Clean Water:</span> <b>${s.utilities.clean_water ? 'Yes' : 'NO'}</b> | 
              <span>Cooking Fuel:</span> <b>${s.utilities.cooking_fuel ? 'Yes' : 'NO'}</b>
            </div>
          `);
        });

        // Draw Road Network Edges
        roadGraph.edges.forEach(edge => {
          const fromNode = roadGraph.nodes[edge.from];
          const toNode = roadGraph.nodes[edge.to];
          if (fromNode && toNode) {
            L.polyline(
              [[fromNode.lat, fromNode.lng], [toNode.lat, toNode.lng]],
              {
                color: edge.submerged ? '#D64545' : '#CBD5E1',
                weight: edge.submerged ? 5 : 2,
                dashArray: edge.submerged ? '6, 6' : '3, 4',
                opacity: edge.submerged ? 0.9 : 0.6
              }
            ).addTo(routes).bindPopup(
              edge.submerged ? '<b style="color: #D64545;">ROAD SUBMERGED - FLASH FLOOD DETOUR ACTIVE</b>' : 'Safe Dry Roadway Segment'
            );
          }
        });

        // Draw Dijkstra Route for Selected Sub-Batch
        if (dijkstraSolution.path.length > 1) {
          const latLngs = dijkstraSolution.path.map(nodeId => {
            const node = roadGraph.nodes[nodeId];
            return [node.lat, node.lng];
          });

          L.polyline(latLngs, {
            color: selectedSubBatch.claim_status === 'rerouted' ? '#23865B' : (selectedSubBatch.claim_status === 'at_risk' ? '#D64545' : '#3563E9'),
            weight: 5,
            opacity: 0.9
          }).addTo(routes);
        }

        // Draw Live Moving Courier Marker (Real-Time GPS Telemetry)
        if (selectedSubBatch && (selectedSubBatch.claim_status === 'in_transit' || selectedSubBatch.claim_status === 'reserved')) {
          const courierIcon = L.divIcon({
            className: 'courier-gps-marker',
            html: `
              <div style="position: relative;">
                <div style="position: absolute; top: -6px; left: -6px; width: 44px; height: 44px; border-radius: 50%; background: rgba(53, 99, 233, 0.25);" class="animate-ping"></div>
                <div style="background-color: #3563E9; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(53,99,233,0.5); border: 2.5px solid #FFFFFF; position: relative; z-index: 2;">
                  <span style="color: white; font-size: 14px;">🚴</span>
                </div>
              </div>
            `,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
          });

          L.marker([courierPosition.lat, courierPosition.lng], { icon: courierIcon })
            .addTo(markers)
            .bindPopup(`
              <div style="font-family: Inter, sans-serif; font-size: 12px; padding: 2px;">
                <b style="color: #3563E9; font-size: 13px;">LIVE COURIER TELEMETRY</b><br/>
                <span style="color: #172B4D; font-weight: 600;">${selectedSubBatch.rider_name || 'Active Courier'}</span><br/>
                <span>Payload:</span> <b>${selectedSubBatch.id} (${selectedSubBatch.units} meals)</b><br/>
                <span>Speed:</span> <b style="color: #23865B;">${telemetrySpeedKmh} km/h</b><br/>
                <span>GPS:</span> <code>${courierPosition.lat.toFixed(4)}, ${courierPosition.lng.toFixed(4)}</code><br/>
                <span style="font-size: 10px; color: #6254C7;">● Supabase Realtime Stream Active</span>
              </div>
            `);
        }

      }, [shelters, roadGraph, selectedSubBatchId, dijkstraSolution, courierPosition, isTelemetryLive]);

      // Metrics Computation
      const metrics = useMemo(() => {
        const activeDeliveries = subBatches.filter(s => s.claim_status === 'in_transit').length;
        const awaitingDispatch = subBatches.filter(s => s.claim_status === 'unassigned').length;
        const atRiskCount = subBatches.filter(s => s.claim_status === 'at_risk' || (new Date(s.expires_at).getTime() - Date.now() < 20 * 60000 && s.claim_status !== 'delivered')).length;
        const availableRiders = 14;
        const totalCapacityRemaining = shelters.reduce((acc, s) => acc + s.capacity_remaining, 0);

        return { activeDeliveries, awaitingDispatch, atRiskCount, availableRiders, totalCapacityRemaining };
      }, [subBatches, shelters]);

      // Calculate time remaining in MM:SS
      const getTimeRemaining = (expiresAt) => {
        const diff = Math.max(0, Math.floor((new Date(expiresAt).getTime() - Date.now()) / 1000));
        const mins = Math.floor(diff / 60);
        const secs = diff % 60;
        return {
          formatted: `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`,
          isUrgent: diff < 25 * 60,
          isExpired: diff === 0
        };
      };

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* ===================================================================
              TOP NAVIGATION BAR
          =================================================================== */}
          <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-resq-border/80 px-6 py-3 flex items-center justify-between shadow-xs">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-lg bg-resq-primary flex items-center justify-center text-white font-bold text-lg shadow-sm">
                <i data-lucide="shield" className="w-5 h-5"></i>
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-bold text-lg text-resq-navy tracking-tight">ResQMesh</span>
                  <span className="text-[10px] bg-resq-pale text-resq-primary font-semibold px-2 py-0.5 rounded border border-blue-100">
                    INTELLIGENT AID DISPATCH
                  </span>
                </div>
                <p className="text-xs text-resq-slate font-medium">Urban Disaster Zero-Waste Micro-Logistics Engine</p>
              </div>
            </div>

            {/* Role-Specific Navigation Tabs */}
            <nav className="hidden md:flex items-center space-x-1 bg-resq-pale p-1 rounded-lg border border-resq-border text-sm font-medium">
              {[
                { id: 'overview', label: currentRole === 'rider' ? 'Rider Console' : currentRole === 'donor' ? 'Donor Portal' : currentRole === 'shelter' ? 'Shelter Manager' : 'Overview', icon: currentRole === 'rider' ? 'bike' : currentRole === 'donor' ? 'heart-handshake' : currentRole === 'shelter' ? 'building' : 'layout-dashboard', roles: ['admin', 'rider', 'donor', 'shelter'] },
                { id: 'batches', label: 'Aid Batches', icon: 'box', roles: ['admin', 'donor'] },
                { id: 'dispatch', label: 'Live Dispatch', icon: 'navigation', roles: ['admin', 'rider'] },
                { id: 'shelters', label: 'Shelter Grid', icon: 'home', roles: ['admin', 'shelter'] },
                { id: 'chaos', label: 'Chaos Deck', icon: 'zap', roles: ['admin'] }
              ]
                .filter(tab => tab.roles.includes(currentRole))
                .map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentTab(tab.id)}
                    className={`flex items-center space-x-2 px-3 py-1.5 rounded-md transition-all ${
                      currentTab === tab.id
                        ? 'bg-white text-resq-primary shadow-xs font-semibold'
                        : 'text-resq-slate hover:text-resq-navy'
                    }`}
                  >
                    <i data-lucide={tab.icon} className="w-4 h-4"></i>
                    <span>{tab.label}</span>
                  </button>
                ))}
            </nav>

            {/* Network State & Role Switcher */}
            <div className="flex items-center space-x-3">
              {/* Network Toggle Button */}
              <button
                onClick={toggleNetworkStatus}
                className={`flex items-center space-x-2 px-3 py-1.5 rounded-md text-xs font-semibold border transition-all ${
                  networkMode === 'ONLINE'
                    ? 'bg-emerald-50 text-resq-green border-emerald-200 hover:bg-emerald-100'
                    : 'bg-resq-ice text-resq-indigo border-indigo-200 animate-pulse'
                }`}
                title="Toggle Online vs Offline Zero-Internet Disaster Mode"
              >
                <span className={`w-2 h-2 rounded-full ${networkMode === 'ONLINE' ? 'bg-resq-green' : 'bg-resq-indigo'}`}></span>
                <span>{networkMode === 'ONLINE' ? 'CONNECTED' : 'OFFLINE MODE'}</span>
                {pendingSyncQueue.length > 0 && (
                  <span className="bg-resq-indigo text-white px-1.5 py-0.2 rounded-full text-[10px] ml-1">
                    {pendingSyncQueue.length}
                  </span>
                )}
              </button>

              {/* Role Switcher with Active Indicator */}
              <div className="flex items-center bg-gray-100 p-0.5 rounded-lg border border-gray-200 text-xs">
                {[
                  { role: 'admin', label: 'Admin', icon: 'shield' },
                  { role: 'rider', label: 'Rider', icon: 'bike' },
                  { role: 'donor', label: 'Donor', icon: 'heart-handshake' },
                  { role: 'shelter', label: 'Shelter', icon: 'home' }
                ].map(item => (
                  <button
                    key={item.role}
                    onClick={() => {
                      setCurrentRole(item.role);
                      if (item.role === 'donor') setCurrentTab('batches');
                      else if (item.role === 'rider') setCurrentTab('dispatch');
                      else if (item.role === 'shelter') setCurrentTab('shelters');
                      else setCurrentTab('overview');
                      showAlert(`ROLE SWITCHED: ${item.label.toUpperCase()}`, `Interface customized with ${item.label}-specific controls and operational views.`, 'info');
                    }}
                    className={`flex items-center space-x-1 px-2.5 py-1 rounded text-xs capitalize transition-all font-medium ${
                      currentRole === item.role
                        ? 'bg-white text-resq-primary font-bold shadow-xs'
                        : 'text-resq-slate hover:text-resq-navy'
                    }`}
                  >
                    <span>{item.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* ===================================================================
              OFFLINE / ALERT BANNER NOTIFICATIONS
          =================================================================== */}
          {networkMode === 'OFFLINE' && (
            <div className="bg-resq-indigo text-white px-6 py-2 text-xs flex items-center justify-between shadow-xs">
              <div className="flex items-center space-x-2">
                <i data-lucide="wifi-off" className="w-4 h-4 text-indigo-200"></i>
                <span className="font-semibold">FLOOD DISASTER MODE: Zero-Internet Operations Engaged.</span>
                <span className="text-indigo-200">Executing client-side Dijkstra route optimization & caching mutations in local IndexedDB.</span>
              </div>
              <div className="flex items-center space-x-4 text-indigo-200 font-mono text-[11px]">
                <span>Last Cloud Sync: {lastSyncTime}</span>
                <span>Queued Outbox: {pendingSyncQueue.length} items</span>
              </div>
            </div>
          )}

          {activeAlert && (
            <div className={`px-6 py-2.5 text-xs flex items-center justify-between border-b ${
              activeAlert.type === 'error' ? 'bg-red-50 text-resq-red border-red-200' :

                    <div>
                      <h3 className="font-bold text-sm text-resq-navy">Supabase Live Connection & API Key</h3>
                      <p className="text-[11px] text-resq-slate">Enable live replication of shelters, batches & telemetry</p>
                    </div>
                  </div>
                  <button onClick={() => setSupabaseConfigOpen(false)} className="text-resq-slate hover:text-resq-navy">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-resq-navy block mb-1">Supabase Project URL</label>
                    <input
                      type="text"
                      placeholder="https://xyzcompany.supabase.co"
                      value={supabaseUrl}
                      onChange={e => setSupabaseUrl(e.target.value)}
                      className="w-full px-3 py-2 border border-resq-border rounded-lg font-mono focus:outline-none focus:border-resq-primary text-xs"
                    />
                    <span className="text-[10px] text-resq-slate">From Project Settings &rarr; API</span>
                  </div>

                  <div>
                    <label className="font-semibold text-resq-navy block mb-1">Supabase Anon Public API Key</label>
                    <textarea
                      rows={3}
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      value={supabaseAnonKey}
                      onChange={e => setSupabaseAnonKey(e.target.value)}
                      className="w-full px-3 py-2 border border-resq-border rounded-lg font-mono focus:outline-none focus:border-resq-primary text-xs"
                    ></textarea>
                    <span className="text-[10px] text-resq-slate">Safe for public browser clients with Row Level Security</span>
                  </div>

                  <div className="bg-emerald-50 border border-emerald-200 p-2.5 rounded-lg text-emerald-800 text-[11px] space-y-1">
                    <div className="font-bold flex items-center space-x-1">
                      <span>✓ Realtime Replication Ready</span>
                    </div>
                    <div>
                      When active, courier heartbeats and walk-in shelter intakes replicate across all active devices in &lt; 2 seconds.
                    </div>
                  </div>

                  <div className="pt-2 border-t border-resq-border flex space-x-2">
                    <button
                      type="button"
                      onClick={() => {
                        localStorage.setItem('resq_supabase_url', supabaseUrl);
                        localStorage.setItem('resq_supabase_anon_key', supabaseAnonKey);
                        setSupabaseConnected(true);
                        setSupabaseConfigOpen(false);
                        showAlert('SUPABASE LIVE SYNC ENGAGED', 'Live database listeners and Realtime channels initialized successfully!', 'success');
                        addLog('SUPABASE_CONFIG', `Connected to Supabase endpoint: ${supabaseUrl}`);
                      }}
                      className="flex-1 py-2 bg-resq-primary hover:bg-blue-700 text-white rounded-lg font-semibold text-xs shadow-xs"
                    >
                      Save & Activate Live Realtime
                    </button>
                    <button
                      type="button"
                      onClick={() => setSupabaseConfigOpen(false)}
                      className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-resq-navy rounded-lg font-semibold text-xs"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
